<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datas Dobradas - Pinheiro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
            --blue: #38bdf8;
            --yellow: #fbbf24;
            --green: #22c55e;
            --red: #ef4444;
            --border: #30363d;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .sub-header { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; }
        h1 { font-size: 2.2rem; margin: 5px 0 15px 0; font-weight: 800; }

        .status-badges { display: flex; gap: 10px; }
        .badge {
            background: #21262d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
        }

        .dot { height: 10px; width: 10px; border-radius: 50%; background-color: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Painel Superior */
        .top-dashboard {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr 0.8fr 1.2fr;
            gap: 30px;
            margin-bottom: 25px;
            align-items: center;
        }

        .summary-item { display: flex; flex-direction: column; }
        .summary-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        .summary-val { font-size: 1.8rem; font-weight: 800; }

        .legend-box { border-left: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0 25px; display: flex; flex-direction: column; gap: 8px; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--text-dim); }
        .status-circle { width: 10px; height: 10px; border-radius: 50%; }

        .ranking-box { display: flex; flex-direction: column; }
        .ranking-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 10px; }
        .rank-list { display: flex; justify-content: space-between; }
        .rank-item { font-size: 0.85rem; color: var(--text-dim); }
        .rank-item b { color: var(--green); margin-right: 4px; }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card.best { border-color: var(--green); background: linear-gradient(145deg, #064e3b, #161b22); }
        .card.worst { border-color: var(--red); background: linear-gradient(145deg, #7f1d1d, #161b22); }

        .month-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .month-name { font-size: 1.4rem; font-weight: 800; }
        .action-tag { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }

        .section { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .section-title { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; font-weight: 800; letter-spacing: 1px; }

        .metric { display: flex; flex-direction: column; margin-bottom: 8px; }
        .metric-label-row { display: flex; justify-content: space-between; align-items: center; }
        .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }
        .val { font-size: 1.1rem; font-weight: 700; }
        .perc-tag { font-size: 0.7rem; background: rgba(251, 191, 36, 0.2); color: var(--yellow); padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        .btn-export {
            background: var(--green); color: white; border: none; padding: 12px 20px; border-radius: 8px;
            cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px;
        }

        @media (max-width: 1200px) { .grid { grid-template-columns: repeat(2, 1fr); } .top-dashboard { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <div class="sub-header">Central de Inteligência Operacional</div>
                <h1>DATAS DOBRADAS PINHEIRO</h1>
                <div class="status-badges">
                    <div class="badge"><span class="dot"></span> Sistema Online</div>
                    <div id="sync-badge" class="badge"><i class="fas fa-sync fa-spin"></i> Sincronizando...</div>
                </div>
            </div>
            <button class="btn-export" onclick="exportExcel()">
                <i class="fas fa-file-excel"></i> Exportar Excel
            </button>
        </header>

        <div class="top-dashboard">
            <div class="summary-item">
                <span class="summary-label">Venda Geral Acumulada</span>
                <span class="summary-val" style="color: var(--blue);" id="total-geral">R$ 0,00</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Total Promocionado</span>
                <span class="summary-val" style="color: var(--yellow);" id="total-promocionado">R$ 0,00</span>
            </div>
            <div class="legend-box">
                <div class="legend-item"><div class="status-circle" style="background: var(--green);"></div> Melhor Performance</div>
                <div class="legend-item"><div class="status-circle" style="background: var(--red);"></div> Pior Performance</div>
            </div>
            <div class="ranking-box">
                <div class="ranking-title">Ranking de Vendas (Promoção)</div>
                <div class="rank-list" id="rank-list">
                    <!-- Gerado via JS -->
                </div>
            </div>
        </div>

        <div class="grid" id="main-grid">
            <!-- Cards gerados via JS -->
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7cnxA3Ag7GTig-JxsgqHjEQBnginQaA7mgAzXF1TtsPWV3tPEgVJAtIfw36jh6BRP0ZUtQv72SwEi/pub?output=csv';
        
        function parseNum(val) {
            if (!val) return 0;
            if (typeof val === 'number') return val;
            let clean = val.replace('R$', '').replace(/\./g, '').replace(',', '.').trim();
            return parseFloat(clean) || 0;
        }

        async function fetchData() {
            Papa.parse(SHEET_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: (results) => render(results.data)
            });
        }

        function render(data) {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';

            let somaGeral = 0;
            let somaPromo = 0;

            // Encontrar melhor e pior para destaque
            const valoresPromo = data.map(d => parseNum(d['RESULTADO ACAO']));
            const maxVal = Math.max(...valoresPromo);
            const minVal = Math.min(...valoresPromo);

            // Ordenar para ranking
            const sorted = [...data].sort((a,b) => parseNum(b['RESULTADO ACAO']) - parseNum(a['RESULTADO ACAO']));
            const rankDiv = document.getElementById('rank-list');
            rankDiv.innerHTML = sorted.slice(0, 3).map((d, i) => 
                `<div class="rank-item"><b>${i+1}º</b> ${d.MES}</div>`
            ).join('');

            data.forEach(d => {
                const resAcao = parseNum(d['RESULTADO ACAO']);
                const vGeral = parseNum(d['VENDA GERAL DIA']);
                somaGeral += vGeral;
                somaPromo += resAcao;

                const isBest = resAcao === maxVal;
                const isWorst = resAcao === minVal;

                grid.innerHTML += `
                    <div class="card ${isBest ? 'best' : ''} ${isWorst ? 'worst' : ''}">
                        <div class="month-header">
                            <span class="month-name">${d.MES}</span>
                            <span class="action-tag">${d.ACAO || '-'}</span>
                        </div>

                        <div class="section">
                            <div class="section-title">Itens Promocionados</div>
                            <div class="metric">
                                <span class="label">Resultado da Ação</span>
                                <span class="val" style="color: var(--green)">${resAcao.toLocaleString('pt-br',{style:'currency',currency:'BRL'})}</span>
                            </div>
                            <div class="metric">
                                <div class="metric-label-row">
                                    <span class="label">Desconto Aplicado</span>
                                    <span class="perc-tag">${d['DESCONTO %'] || '0%'}</span>
                                </div>
                                <span class="val" style="color: var(--red)">${d['VALOR DESCONTO']}</span>
                            </div>
                            <div class="metric">
                                <span class="label">Qtd de Itens</span>
                                <span class="val">${d['QTD ITENS']}</span>
                            </div>
                        </div>

                        <div class="section">
                            <div class="section-title">Venda Geral do Dia</div>
                            <div class="metric">
                                <span class="label">Valor Total</span>
                                <span class="val" style="color: var(--blue)">${vGeral.toLocaleString('pt-br',{style:'currency',currency:'BRL'})}</span>
                            </div>
                            <div class="metric">
                                <span class="label">Total Compras</span>
                                <span class="val">${d['COMPRAS']}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('total-geral').innerText = somaGeral.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
            document.getElementById('total-promocionado').innerText = somaPromo.toLocaleString('pt-br',{style:'currency',currency:'BRL'});
            document.getElementById('sync-badge').innerHTML = `<i class="far fa-clock"></i> Atualizado: ${new Date().toLocaleTimeString()}`;
        }

        function exportExcel() {
            const table = document.getElementById("main-grid");
            const wb = XLSX.utils.book_new();
            // Aqui convertemos os dados brutos para o excel
            fetch(SHEET_URL).then(res => res.text()).then(csv => {
                const results = Papa.parse(csv, {header:true});
                const ws = XLSX.utils.json_to_sheet(results.data);
                XLSX.utils.book_append_sheet(wb, ws, "DatasDobradas");
                XLSX.writeFile(wb, "Relatorio_Datas_Dobradas.xlsx");
            });
        }

        fetchData();
        setInterval(fetchData, 60000);
    </script>
</body>
</html>
