<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise Analítica de Datas Dobradas - Live Sync</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PapaParse para ler CSV da nuvem -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        
        <!-- Cabeçalho Principal -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight">Datas Dobradas - Análise de Performance</h1>
                    <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Ao Vivo
                    </span>
                </div>
                <p class="text-sm text-slate-500 mt-1">Acompanhamento do impacto das ações promocionais (5.5, 6.6, 7.7, 8.8, 9.9) nas vendas gerais</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="fetchSheetData()" class="inline-flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-4 py-2.5 rounded-xl transition-all text-sm">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Sincronizar Planilha
                </button>
                <button onclick="exportToCSV()" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-xl transition-all shadow-sm text-sm">
                    <i data-lucide="download" class="w-4 h-4"></i> Exportar (.csv)
                </button>
            </div>
        </div>

        <!-- Métricas Gerais (KPIs) -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="kpi-cards">
            <!-- Gerado via JS -->
        </div>

        <!-- Seção de Gráficos Comparativos -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Gráfico 1: Venda Geral vs Promocionada -->
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                        <i data-lucide="bar-chart-2" class="w-5 h-5 text-indigo-600"></i> Venda Geral do Dia vs. Resultado Promocionado (R$)
                    </h3>
                </div>
                <div class="h-72">
                    <canvas id="salesComparisonChart"></canvas>
                </div>
            </div>

            <!-- Gráfico 2: Proporção de Descontos por Ação -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                        <i data-lucide="pie-chart" class="w-5 h-5 text-indigo-600"></i> Distribuição do Faturamento Promocionado
                    </h3>
                </div>
                <div class="h-72 relative flex items-center justify-center">
                    <canvas id="promoShareChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Filtros por Mês -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2" id="month-filters">
            <!-- Botões dinâmicos de filtro -->
        </div>

        <!-- Cards Mensais Detalhados -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="monthly-cards-container">
            <!-- Cards de meses carregados via JS -->
        </div>

    </div>

    <script>
        // Link da planilha em formato CSV publicado na web
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7cnxA3Ag7GTig-JxsgqHjEQBnginQaA7mgAzXF1TtsPWV3tPEgVJAtlfw36jh6BRPOZUtQv72SwEi/pub?output=csv';

        let datasDobradasData = [];
        let salesChartInstance = null;
        let shareChartInstance = null;

        function parseBrazilianNumber(val) {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return val;
            let cleanStr = val.toString().replace(/R\$\s?/g, '').trim();
            if (cleanStr.includes(',') && cleanStr.includes('.')) {
                cleanStr = cleanStr.replace(/\./g, '').replace(',', '.');
            } else if (cleanStr.includes(',')) {
                cleanStr = cleanStr.replace(',', '.');
            }
            const result = parseFloat(cleanStr);
            return isNaN(result) ? 0 : result;
        }

        function formatCurrency(val) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        }

        function fetchSheetData() {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processData(results.data);
                    } else {
                        useFallbackData();
                    }
                },
                error: function(err) {
                    console.warn("Erro na leitura da planilha online. A carregar dados locais...", err);
                    useFallbackData();
                }
            });
        }

        function processData(rows) {
            datasDobradasData = rows.map(r => {
                const getVal = (keys) => {
                    for (let k of keys) {
                        if (r[k] !== undefined && r[k] !== '') return r[k];
                    }
                    return 0;
                };

                return {
                    mes: getVal(['Mes', 'Mês', 'MES', 'MÊS', 'Ação', 'Acao']) || "Mês",
                    vendaGeral: parseBrazilianNumber(getVal(['Venda Geral', 'Venda Geral do Dia', 'Total Geral', 'VALOR TOTAL'])),
                    vendaPromocionada: parseBrazilianNumber(getVal(['Resultado Ação', 'Resultado da Ação', 'Venda Promocionada', 'RESULTADO DA AÇÃO'])),
                    descontoAplicado: parseBrazilianNumber(getVal(['Desconto Aplicado', 'DESCONTO APLICADO', 'Desconto'])),
                    qtdItens: Math.round(parseBrazilianNumber(getVal(['Qtd Itens', 'QTD DE ITENS', 'Itens Promocionados', 'Qtd Itens Promocionados']))),
                    totalCompras: Math.round(parseBrazilianNumber(getVal(['Total Compras', 'TOTAL COMPRAS', 'Pedidos', 'Qtd Pedidos'])))
                };
            });

            const total = datasDobradasData.reduce((a, b) => a + b.vendaGeral, 0);
            if (total === 0) {
                useFallbackData();
                return;
            }

            updateDashboard();
        }

        function useFallbackData() {
            datasDobradasData = [
                { mes: "Maio (5.5)", vendaGeral: 86891.80, vendaPromocionada: 63201.01, descontoAplicado: 40167.36, qtdItens: 2245, totalCompras: 505 },
                { mes: "Junho (6.6)", vendaGeral: 49411.44, vendaPromocionada: 22084.95, descontoAplicado: 12754.50, qtdItens: 1886, totalCompras: 301 },
                { mes: "Julho (7.7)", vendaGeral: 161651.44, vendaPromocionada: 128679.60, descontoAplicado: 64730.77, qtdItens: 12542, totalCompras: 682 },
                { mes: "Agosto (8.8)", vendaGeral: 62051.10, vendaPromocionada: 32408.97, descontoAplicado: 16670.06, qtdItens: 887, totalCompras: 272 },
                { mes: "Setembro (9.9)", vendaGeral: 151901.25, vendaPromocionada: 128341.80, descontoAplicado: 50407.50, qtdItens: 14322, totalCompras: 508 }
            ];
            updateDashboard();
        }

        function updateDashboard() {
            renderKPIs();
            renderFilterButtons();
            renderCards(datasDobradasData);
            initCharts();
            lucide.createIcons();
        }

        function renderKPIs() {
            const totalGeral = datasDobradasData.reduce((acc, curr) => acc + curr.vendaGeral, 0);
            const totalPromocionado = datasDobradasData.reduce((acc, curr) => acc + curr.vendaPromocionada, 0);
            const totalDesconto = datasDobradasData.reduce((acc, curr) => acc + curr.descontoAplicado, 0);
            const totalItens = datasDobradasData.reduce((acc, curr) => acc + curr.qtdItens, 0);
            const pctPromocionado = totalGeral > 0 ? ((totalPromocionado / totalGeral) * 100).toFixed(1) : 0;

            const container = document.getElementById('kpi-cards');
            container.innerHTML = `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Venda Geral Acumulada</p>
                    <h2 class="text-2xl font-bold text-slate-900 mt-1">${formatCurrency(totalGeral)}</h2>
                    <span class="text-xs text-indigo-600 font-medium flex items-center gap-1 mt-1">
                        <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i> Faturamento Total dos Dias
                    </span>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Resultado Promocionado</p>
                    <h2 class="text-2xl font-bold text-slate-900 mt-1">${formatCurrency(totalPromocionado)}</h2>
                    <span class="text-xs text-emerald-600 font-medium flex items-center gap-1 mt-1">
                        <i data-lucide="trending-up" class="w-3.5 h-3.5"></i> ${pctPromocionado}% da Venda Total
                    </span>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total de Descontos</p>
                    <h2 class="text-2xl font-bold text-slate-900 mt-1">${formatCurrency(totalDesconto)}</h2>
                    <span class="text-xs text-rose-500 font-medium flex items-center gap-1 mt-1">
                        <i data-lucide="tag" class="w-3.5 h-3.5"></i> Abatimento Promocional
                    </span>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Itens Promocionados</p>
                    <h2 class="text-2xl font-bold text-slate-900 mt-1">${totalItens.toLocaleString('pt-BR')}</h2>
                    <span class="text-xs text-amber-600 font-medium flex items-center gap-1 mt-1">
                        <i data-lucide="box" class="w-3.5 h-3.5"></i> Volume de produtos em oferta
                    </span>
                </div>
            `;
        }

        function renderFilterButtons() {
            const container = document.getElementById('month-filters');
            let html = `<button onclick="filterMonth('all')" class="filter-btn active bg-indigo-600 text-white font-medium px-4 py-2 rounded-xl text-sm transition-all shadow-sm shrink-0">Todas as Ações</button>`;
            
            datasDobradasData.forEach(m => {
                html += `<button onclick="filterMonth('${m.mes}')" class="filter-btn bg-white text-slate-600 hover:bg-slate-50 font-medium px-4 py-2 rounded-xl text-sm border border-slate-200 transition-all shrink-0">${m.mes}</button>`;
            });
            container.innerHTML = html;
        }

        function renderCards(data) {
            const container = document.getElementById('monthly-cards-container');
            container.innerHTML = '';

            data.forEach(m => {
                const pctPromo = m.vendaGeral > 0 ? ((m.vendaPromocionada / m.vendaGeral) * 100).toFixed(1) : 0;
                const ticketPromo = m.totalCompras > 0 ? (m.vendaPromocionada / m.totalCompras) : 0;

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all space-y-5 flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <!-- Cabeçalho do Card -->
                        <div class="flex justify-between items-start border-b border-slate-100 pb-4">
                            <div>
                                <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full uppercase tracking-wider">${m.mes}</span>
                                <h3 class="text-2xl font-bold text-slate-900 mt-2">${formatCurrency(m.vendaPromocionada)}</h3>
                                <p class="text-xs text-slate-400 mt-0.5">Resultado de itens promocionados</p>
                            </div>
                            <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold px-2.5 py-1 rounded-lg">${pctPromo}% da Venda</span>
                        </div>

                        <!-- Venda Geral vs Desconto -->
                        <div class="mt-4 grid grid-cols-2 gap-3">
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <span class="text-[11px] font-semibold text-slate-400 uppercase block">Venda Geral</span>
                                <strong class="text-sm font-bold text-slate-800">${formatCurrency(m.vendaGeral)}</strong>
                                <span class="text-[10px] text-slate-500 block mt-0.5">${m.totalCompras} pedidos</span>
                            </div>
                            <div class="bg-rose-50/50 p-3 rounded-xl border border-rose-100">
                                <span class="text-[11px] font-semibold text-rose-500 uppercase block">Desconto Concedido</span>
                                <strong class="text-sm font-bold text-rose-700">${formatCurrency(m.descontoAplicado)}</strong>
                                <span class="text-[10px] text-rose-500 block mt-0.5">${m.qtdItens.toLocaleString('pt-BR')} itens</span>
                            </div>
                        </div>

                        <!-- Indicadores Complementares -->
                        <div class="mt-4 bg-slate-50 p-3 rounded-xl space-y-2">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-500 font-medium">Ticket Médio Promocionado:</span>
                                <strong class="text-slate-800 font-bold">${formatCurrency(ticketPromo)}</strong>
                            </div>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-slate-500 font-medium">Média Itens por Pedido:</span>
                                <strong class="text-slate-800 font-bold">${m.totalCompras > 0 ? (m.qtdItens / m.totalCompras).toFixed(1) : 0} itens</strong>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterMonth(month) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'active');
                btn.classList.add('bg-white', 'text-slate-600');
            });

            if (event && event.target) {
                event.target.classList.add('bg-indigo-600', 'text-white', 'active');
                event.target.classList.remove('bg-white', 'text-slate-600');
            }

            if (month === 'all') {
                renderCards(datasDobradasData);
            } else {
                const filtered = datasDobradasData.filter(d => d.mes === month);
                renderCards(filtered);
            }
        }

        function initCharts() {
            if (salesChartInstance) salesChartInstance.destroy();
            if (shareChartInstance) shareChartInstance.destroy();

            // Gráfico 1: Barras Comparativas (Venda Geral vs Promocionada)
            const ctxSales = document.getElementById('salesComparisonChart').getContext('2d');
            salesChartInstance = new Chart(ctxSales, {
                type: 'bar',
                data: {
                    labels: datasDobradasData.map(d => d.mes),
                    datasets: [
                        {
                            label: 'Venda Geral (R$)',
                            data: datasDobradasData.map(d => d.vendaGeral),
                            backgroundColor: '#94a3b8',
                            borderRadius: 6
                        },
                        {
                            label: 'Resultado Promocionado (R$)',
                            data: datasDobradasData.map(d => d.vendaPromocionada),
                            backgroundColor: '#6366f1',
                            borderRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: {
                        y: { ticks: { callback: v => 'R$ ' + (v/1000).toFixed(0) + 'k' } }
                    }
                }
            });

            // Gráfico 2: Doughnut do Faturamento Promocionado
            const ctxShare = document.getElementById('promoShareChart').getContext('2d');
            shareChartInstance = new Chart(ctxShare, {
                type: 'doughnut',
                data: {
                    labels: datasDobradasData.map(d => d.mes),
                    datasets: [{
                        data: datasDobradasData.map(d => d.vendaPromocionada),
                        backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#3b82f6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } },
                    cutout: '68%'
                }
            });
        }

        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Acao,Venda Geral,Venda Promocionada,Desconto Aplicado,Qtd Itens,Total Compras\n";
            datasDobradasData.forEach(row => {
                csvContent += `${row.mes},${row.vendaGeral},${row.vendaPromocionada},${row.descontoAplicado},${row.qtdItens},${row.totalCompras}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "analise_datas_dobradas.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = function() {
            fetchSheetData();
        };
    </script>
</body>
</html>
