<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datas Dobradas — Painel Analítico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Datas Dobradas — Análise de Performance</h1>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Ao Vivo
          </span>
        </div>
        <p class="text-sm text-slate-500 mt-1">Acompanhamento do impacto das datas dobradas nas vendas gerais (5.5, 6.6, 7.7, 8.8, 9.9, 10.10)</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchSheetData()" class="inline-flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium px-4 py-2.5 rounded-xl transition-all text-sm border border-indigo-200">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i> Sincronizar Planilha
        </button>
        <button onclick="exportToCSV()" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-xl transition-all shadow-sm text-sm">
          <i data-lucide="download" class="w-4 h-4"></i> Exportar (.csv)
        </button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="kpi-cards"></div>

    <!-- Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-slate-800 text-base mb-4 flex items-center gap-2">
          <i data-lucide="bar-chart-2" class="w-5 h-5 text-indigo-600"></i> Venda Geral vs. Resultado Promocionado (R$)
        </h3>
        <div class="h-72"><canvas id="salesComparisonChart"></canvas></div>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-slate-800 text-base mb-4 flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-5 h-5 text-indigo-600"></i> Distribuição Promocionada
        </h3>
        <div class="h-72 relative flex items-center justify-center"><canvas id="promoShareChart"></canvas></div>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2" id="month-filters"></div>

    <!-- Cards Container -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="monthly-cards-container"></div>
  </div>

  <script>
    let csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7cnxA3Ag7GTig-JxsgqHjEQBnginQaA7mgAzXF1TtsPWV3tPEgVJAtIfw36jh6BRP0ZUtQv72SwEi/pubhtml";
    let datasDobradasData = [
  {
    "id": "row-0-1791917323143-uvzy",
    "mes": "Maio (5.5)",
    "vendaGeral": 86891.8,
    "vendaPromocionada": 63291.01,
    "descontoAplicado": 40167.36,
    "qtdItens": 2245,
    "totalCompras": 505
  },
  {
    "id": "row-1-1791917323144-wcoi",
    "mes": "Junho (6.6)",
    "vendaGeral": 49411.44,
    "vendaPromocionada": 22984.95,
    "descontoAplicado": 12754.5,
    "qtdItens": 1886,
    "totalCompras": 301
  },
  {
    "id": "row-2-1791917323144-voic",
    "mes": "Julho (7.7)",
    "vendaGeral": 161651.44,
    "vendaPromocionada": 128679.6,
    "descontoAplicado": 64730.77,
    "qtdItens": 12542,
    "totalCompras": 682
  },
  {
    "id": "row-3-1791917323144-tfw9",
    "mes": "Agosto (8.8)",
    "vendaGeral": 62051.1,
    "vendaPromocionada": 32408.97,
    "descontoAplicado": 16670.06,
    "qtdItens": 887,
    "totalCompras": 272
  },
  {
    "id": "row-4-1791917323144-ask7",
    "mes": "Setembro (9.9)",
    "vendaGeral": 151901.25,
    "vendaPromocionada": 128341.8,
    "descontoAplicado": 50407.5,
    "qtdItens": 14322,
    "totalCompras": 508
  },
  {
    "id": "row-5-1791917323145-h57m",
    "mes": "Outubro (10.10)",
    "vendaGeral": 87025.51,
    "vendaPromocionada": 44132.12,
    "descontoAplicado": 0,
    "qtdItens": 8404,
    "totalCompras": 474
  }
];
    let salesChartInstance = null;
    let shareChartInstance = null;

    function formatCurrency(val) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
    }
    function formatNumber(val) {
      return new Intl.NumberFormat('pt-BR').format(Math.round(val || 0));
    }

    function renderKPIs() {
      const totalGeral = datasDobradasData.reduce((a, b) => a + b.vendaGeral, 0);
      const totalPromo = datasDobradasData.reduce((a, b) => a + b.vendaPromocionada, 0);
      const totalDesconto = datasDobradasData.reduce((a, b) => a + b.descontoAplicado, 0);
      const totalItens = datasDobradasData.reduce((a, b) => a + b.qtdItens, 0);
      const pct = totalGeral > 0 ? ((totalPromo / totalGeral) * 100).toFixed(1) : 0;

      document.getElementById('kpi-cards').innerHTML = `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <span class="text-xs font-semibold text-slate-400 uppercase">Venda Geral Acumulada</span>
          <h2 class="text-2xl font-extrabold text-slate-900 mt-1">${formatCurrency(totalGeral)}</h2>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <span class="text-xs font-semibold text-slate-400 uppercase">Resultado Promocionado</span>
          <h2 class="text-2xl font-extrabold text-slate-900 mt-1">${formatCurrency(totalPromo)}</h2>
          <span class="text-xs text-emerald-600 font-semibold">${pct}% da Venda Total</span>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <span class="text-xs font-semibold text-slate-400 uppercase">Total de Descontos</span>
          <h2 class="text-2xl font-extrabold text-slate-900 mt-1">${formatCurrency(totalDesconto)}</h2>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <span class="text-xs font-semibold text-slate-400 uppercase">Itens Promocionados</span>
          <h2 class="text-2xl font-extrabold text-slate-900 mt-1">${formatNumber(totalItens)}</h2>
        </div>
      `;
    }

    function renderFilterButtons(active) {
      active = active || 'all';
      let html = `<button onclick="filterMonth('all')" class="px-4 py-2 rounded-xl text-sm font-semibold ${active === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 border border-slate-200'}">Todas as Ações</button>`;
      datasDobradasData.forEach(d => {
        html += `<button onclick="filterMonth('${d.mes}')" class="px-4 py-2 rounded-xl text-sm font-semibold ${active === d.mes ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700 border border-slate-200'}">${d.mes}</button>`;
      });
      document.getElementById('month-filters').innerHTML = html;
    }

    function renderCards(data) {
      const container = document.getElementById('monthly-cards-container');
      container.innerHTML = '';
      data.forEach(m => {
        const pct = m.vendaGeral > 0 ? ((m.vendaPromocionada / m.vendaGeral) * 100).toFixed(1) : 0;
        const card = document.createElement('div');
        card.className = "bg-white border border-slate-200 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all";
        card.innerHTML = `
          <div class="flex justify-between items-start border-b border-slate-100 pb-3">
            <div>
              <span class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-full uppercase">${m.mes}</span>
              <h3 class="text-2xl font-extrabold text-slate-900 mt-2">${formatCurrency(m.vendaPromocionada)}</h3>
            </div>
            <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold px-2 py-1 rounded-lg">${pct}% da Venda</span>
          </div>
          <div class="mt-4 grid grid-cols-2 gap-3 text-xs">
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
              <span class="text-slate-400 block font-semibold uppercase text-[10px]">Venda Geral</span>
              <strong class="text-sm font-bold text-slate-800">${formatCurrency(m.vendaGeral)}</strong>
            </div>
            <div class="bg-rose-50/60 p-3 rounded-xl border border-rose-100">
              <span class="text-rose-500 block font-semibold uppercase text-[10px]">Desconto</span>
              <strong class="text-sm font-bold text-rose-700">${formatCurrency(m.descontoAplicado)}</strong>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterMonth(month) {
      renderFilterButtons(month);
      if (month === 'all') {
        renderCards(datasDobradasData);
      } else {
        renderCards(datasDobradasData.filter(d => d.mes === month));
      }
    }

    function initCharts() {
      if (salesChartInstance) salesChartInstance.destroy();
      if (shareChartInstance) shareChartInstance.destroy();

      const ctxSales = document.getElementById('salesComparisonChart').getContext('2d');
      salesChartInstance = new Chart(ctxSales, {
        type: 'bar',
        data: {
          labels: datasDobradasData.map(d => d.mes),
          datasets: [
            { label: 'Venda Geral', data: datasDobradasData.map(d => d.vendaGeral), backgroundColor: '#94a3b8', borderRadius: 6 },
            { label: 'Resultado Promo', data: datasDobradasData.map(d => d.vendaPromocionada), backgroundColor: '#6366f1', borderRadius: 6 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      const ctxShare = document.getElementById('promoShareChart').getContext('2d');
      shareChartInstance = new Chart(ctxShare, {
        type: 'doughnut',
        data: {
          labels: datasDobradasData.map(d => d.mes),
          datasets: [{
            data: datasDobradasData.map(d => d.vendaPromocionada),
            backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#3b82f6', '#8b5cf6', '#14b8a6', '#f97316'],
            borderWidth: 0
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, cutout: '70%' }
      });
    }

    function updateDashboard() {
      renderKPIs();
      renderFilterButtons('all');
      renderCards(datasDobradasData);
      initCharts();
      if (window.lucide) lucide.createIcons();
    }

    function exportToCSV() {
      let csv = "Mes;Venda Geral;Resultado Promo;Desconto;Itens;Compras\n";
      datasDobradasData.forEach(r => {
        csv += `${r.mes};${r.vendaGeral};${r.vendaPromocionada};${r.descontoAplicado};${r.qtdItens};${r.totalCompras}\n`;
      });
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'datas_dobradas_export.csv';
      a.click();
    }

    window.onload = updateDashboard;
  </script>
</body>
</html>
